<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatMHAT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* ---- surface layers ---- */
    --void: #05070a;
    --bg: #090c11;
    --panel: #0d1116;
    --surface: #11161d;
    --surface-2: #171d26;
    --surface-hover: #1c232e;

    /* ---- borders ---- */
    --hairline: #1c2229;
    --hairline-strong: #2a323d;
    --hairline-accent: rgba(79, 224, 208, 0.35);

    /* ---- text ---- */
    --ink: #eef2f7;
    --ink-soft: #c3ccd8;
    --body-c: #8b96a8;
    --mute: #545e6e;

    /* ---- signal palette ---- */
    --cyan: #4fe0d0;
    --cyan-dim: #2b8f85;
    --violet: #8b7cf6;
    --amber: #f6b756;
    --red: #ff5f6d;
    --green: #3ddc84;

    --on-accent: #05070a;
    --focus-ring: rgba(79, 224, 208, 0.35);

    --font-display: 'Space Grotesk', 'SF Pro Rounded', system-ui, sans-serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --sp-xxs: 2px;
    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 12px;
    --sp-lg: 16px;
    --sp-xl: 24px;
    --sp-xxl: 32px;

    --r-sm: 6px;
    --r-md: 9px;
    --r-lg: 14px;
    --r-full: 9999px;
  }

  *{ box-sizing: border-box; }

  ::selection{
    background: rgba(79, 224, 208, 0.25);
    color: var(--ink);
  }

  html{ background: var(--void); }

  body{
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background:
      radial-gradient(ellipse 900px 480px at 15% -10%, rgba(139,124,246,0.10), transparent 60%),
      radial-gradient(ellipse 700px 420px at 100% 0%, rgba(79,224,208,0.08), transparent 55%),
      var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button, input{
    font-family: inherit;
  }

  /* custom scrollbars */
  *::-webkit-scrollbar{ width: 8px; height: 8px; }
  *::-webkit-scrollbar-track{ background: transparent; }
  *::-webkit-scrollbar-thumb{
    background: var(--hairline-strong);
    border-radius: var(--r-full);
  }
  *::-webkit-scrollbar-thumb:hover{ background: var(--mute); }

  /* ============================================================
     HEADER
     ============================================================ */

  .nav{
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--sp-xl);
    border-bottom: 1px solid var(--hairline);
    background: rgba(9, 12, 17, 0.85);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 10;
  }

  .nav-left{
    display: flex;
    align-items: center;
    gap: var(--sp-md);
  }

  .nav-mark{
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px rgba(79,224,208,0.35);
    flex-shrink: 0;
  }

  .nav-mark svg{ width: 14px; height: 14px; }

  .nav-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .nav-title .accent{ color: var(--cyan); }

  /* signature element: pipeline rail — embed / retrieve / generate */
  .pipeline-rail{
    display: none;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--mute);
    text-transform: uppercase;
  }

  @media (min-width: 860px){
    .pipeline-rail{ display: flex; }
  }

  .pipeline-node{
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pipeline-node .dot{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--hairline-strong);
  }

  .pipeline-node.n1 .dot{ background: var(--cyan); box-shadow: 0 0 6px var(--cyan); animation: node-glow 3.6s ease-in-out infinite; }
  .pipeline-node.n2 .dot{ background: var(--violet); box-shadow: 0 0 6px var(--violet); animation: node-glow 3.6s ease-in-out 1.2s infinite; }
  .pipeline-node.n3 .dot{ background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: node-glow 3.6s ease-in-out 2.4s infinite; }

  @keyframes node-glow{
    0%, 40%, 100% { opacity: 0.45; transform: scale(1); }
    15% { opacity: 1; transform: scale(1.4); }
  }

  .pipeline-track{
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, var(--hairline-strong), var(--hairline-strong));
    position: relative;
    overflow: hidden;
  }

  .pipeline-track::after{
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: track-sweep 3.6s linear infinite;
  }

  @keyframes track-sweep{
    0% { transform: translateX(-120%); }
    100% { transform: translateX(340%); }
  }

  .nav-status{
    display: flex;
    align-items: center;
    gap: var(--sp-xs);
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--mute);
    padding: 5px 10px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    background: var(--surface);
  }

  .nav-status-dot{
    width: 6px;
    height: 6px;
    border-radius: var(--r-full);
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse-live 2.4s ease-in-out infinite;
  }

  @keyframes pulse-live{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ============================================================
     LAYOUT
     ============================================================ */

  .shell{
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ============================================================
     DOCUMENTS PANEL
     ============================================================ */

  .doc-panel{
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }

  .doc-panel-header{
    padding: var(--sp-lg) var(--sp-lg) var(--sp-md);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .doc-panel-header h2{
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.01em;
  }

  .doc-count{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mute);
  }

  /* ---------- upload ---------- */

  .dropzone{
    margin: 0 var(--sp-lg) var(--sp-lg);
    border: 1px dashed var(--hairline-strong);
    border-radius: var(--r-lg);
    padding: var(--sp-lg);
    text-align: center;
    cursor: pointer;
    display: block;
    position: relative;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    background: linear-gradient(180deg, rgba(79,224,208,0.03), transparent);
  }

  .dropzone:hover{
    border-color: var(--cyan-dim);
    background: rgba(79,224,208,0.05);
  }

  .dropzone.dragover{
    border-color: var(--cyan);
    background: rgba(79,224,208,0.08);
    transform: scale(1.01);
    box-shadow: 0 0 0 3px rgba(79,224,208,0.12);
  }

  .dropzone-icon{
    font-size: 18px;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  .dropzone-label{
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .dropzone-sub{
    margin-top: var(--sp-xxs);
    font-size: 11.5px;
    color: var(--mute);
    font-family: var(--font-mono);
  }

  .dropzone input[type="file"]{
    display: none;
  }

  /* ---------- document list ---------- */

  .doc-list{
    flex: 1;
    overflow-y: auto;
    padding: 0 var(--sp-lg) var(--sp-lg);
    display: flex;
    flex-direction: column;
    gap: var(--sp-sm);
  }

  .doc-empty{
    font-size: 13px;
    color: var(--mute);
    padding: var(--sp-md) 0;
    font-family: var(--font-mono);
  }

  .doc-row{
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: var(--sp-md);
    position: relative;
    background: var(--surface);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .doc-row:hover{
    border-color: var(--hairline-strong);
    background: var(--surface-2);
  }

  .doc-row-top{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-sm);
  }

  .doc-name{
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .doc-delete{
    background: none;
    border: none;
    color: var(--mute);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 4px;
    border-radius: var(--r-full);
    flex-shrink: 0;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .doc-delete:hover{
    color: var(--red);
    background: rgba(255,95,109,0.1);
  }

  .doc-delete:disabled{
    opacity: 0.35;
    cursor: default;
  }

  .doc-delete:disabled:hover{
    color: var(--mute);
    background: none;
  }

  .doc-status{
    display: flex;
    align-items: center;
    gap: var(--sp-xs);
    margin-top: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.01em;
  }

  .doc-status-dot{
    width: 6px;
    height: 6px;
    border-radius: var(--r-full);
    flex-shrink: 0;
  }

  .doc-status.processing .doc-status-dot{
    background: var(--amber);
    box-shadow: 0 0 7px var(--amber);
    animation: dot-pulse 1.1s ease-in-out infinite;
  }

  .doc-status.processing .doc-status-text{
    color: var(--amber);
  }

  .doc-status.ready .doc-status-dot{
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  .doc-status.ready .doc-status-text{
    color: var(--mute);
  }

  .doc-status.error .doc-status-dot{
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }

  .doc-status.error .doc-status-text{
    color: var(--red);
  }

  @keyframes dot-pulse{
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ============================================================
     CHAT
     ============================================================ */

  .chat-panel{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
    position: relative;
  }

  .chat-panel::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
  }

  .chat-log{
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-xxl) var(--sp-xl);
    display: flex;
    flex-direction: column;
    gap: var(--sp-lg);
    position: relative;
    z-index: 1;
  }

  .chat-log-inner{
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--sp-lg);
  }

  .msg-row{
    display: flex;
    animation: msg-in 0.25s ease;
  }

  @keyframes msg-in{
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user{
    justify-content: flex-end;
  }

  .msg-row.assistant{
    justify-content: flex-start;
  }

  .msg-block{
    max-width: 80%;
  }

  .msg-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 6px;
  }

  .msg-row.user .msg-label{
    text-align: right;
  }

  .msg-row.user .msg-bubble{
    background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-dim) 130%);
    color: var(--on-accent);
    padding: var(--sp-sm) var(--sp-lg);
    border-radius: 16px 16px 4px 16px;
    font-size: 15px;
    line-height: 1.55;
    font-weight: 500;
  }

  .msg-row.assistant .msg-bubble{
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    border-left: 2px solid var(--hairline-strong);
    padding-left: var(--sp-md);
  }

  .msg-bubble.error{
    color: var(--red);
    border-left-color: var(--red);
  }

  .msg-bubble strong{
    color: var(--ink);
    font-weight: 700;
  }

  .msg-bubble em{
    color: var(--ink-soft);
    font-style: italic;
  }

  .msg-bubble code{
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--cyan);
  }

  /* ============================================================
     SOURCES / REFERENCES
     ============================================================ */

  .sources{
    margin-top: 14px;
    padding-left: var(--sp-md);
    display: none;
    flex-direction: column;
    gap: 6px;
  }

  .sources.visible{
    display: flex;
  }

  .sources-title{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 2px;
  }

  .source-list{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .source-item{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--body-c);
    font-size: 11.5px;
    font-family: var(--font-mono);
    max-width: 240px;
    transition: border-color 0.15s ease;
  }

  .source-item:hover{
    border-color: var(--cyan-dim);
    color: var(--ink-soft);
  }

  .source-icon{
    flex-shrink: 0;
    font-size: 12px;
    opacity: 0.75;
  }

  .source-filename{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ============================================================
     COMPOSER
     ============================================================ */

  .composer{
    border-top: 1px solid var(--hairline);
    padding: var(--sp-lg) var(--sp-xl);
    padding-bottom: max(var(--sp-lg), env(safe-area-inset-bottom));
    background: rgba(9, 12, 17, 0.85);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 2;
  }

  .composer-inner{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: var(--sp-sm);
    align-items: center;
  }

  #input{
    flex: 1;
    height: 42px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    padding: var(--sp-sm) var(--sp-lg);
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #input:focus{
    border-color: var(--cyan-dim);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  #input::placeholder{
    color: var(--mute);
  }

  .btn-primary{
    height: 38px;
    padding: 8px 20px;
    background: var(--cyan);
    color: var(--on-accent);
    border: none;
    border-radius: var(--r-full);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 rgba(79,224,208,0);
  }

  .btn-primary:hover:not(:disabled){
    box-shadow: 0 0 18px rgba(79,224,208,0.35);
  }

  .btn-primary:active:not(:disabled){
    transform: scale(0.96);
  }

  .btn-primary:disabled{
    background: var(--surface-2);
    color: var(--mute);
    cursor: default;
    box-shadow: none;
  }

  #stopBtn{
    background: var(--surface-2);
    color: var(--ink-soft);
    border: 1px solid var(--hairline-strong);
  }

  #stopBtn:hover:not(:disabled){
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 14px rgba(255,95,109,0.2);
  }

  #stopBtn:disabled{
    background: transparent;
    border-color: var(--hairline);
    color: var(--mute);
  }

  button:focus-visible,
  input:focus-visible,
  .doc-delete:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */

  @media (max-width: 768px){
    .shell{
      flex-direction: column;
    }

    .doc-panel{
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--hairline);
      max-height: 38vh;
    }

    .nav{
      padding: 0 var(--sp-lg);
    }

    .chat-log{
      padding: var(--sp-xl) var(--sp-lg);
    }

    .composer{
      padding: var(--sp-md) var(--sp-lg);
      padding-bottom: max(var(--sp-md), env(safe-area-inset-bottom));
    }

    .msg-block{
      max-width: 92%;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .doc-status.processing .doc-status-dot,
    .nav-status-dot,
    .pipeline-node .dot,
    .pipeline-track::after,
    .msg-row{
      animation: none !important;
    }
  }
</style>
</head>

<body>

<!-- ============================================================
     HEADER
     ============================================================ -->

<div class="nav">
  <div class="nav-left">
    <span class="nav-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 6V12C4 16.5 7.4 20.7 12 22C16.6 20.7 20 16.5 20 12V6L12 2Z" fill="#05070a"/>
      </svg>
    </span>
    <span class="nav-title">Chat<span class="accent">MHAT</span></span>
  </div>

  <div class="pipeline-rail">
    <span class="pipeline-node n1"><span class="dot"></span>Embed</span>
    <span class="pipeline-track"></span>
    <span class="pipeline-node n2"><span class="dot"></span>Retrieve</span>
    <span class="pipeline-track"></span>
    <span class="pipeline-node n3"><span class="dot"></span>Generate</span>
  </div>

  <span class="nav-status">
    <span class="nav-status-dot"></span>
    127.0.0.1:8000
  </span>
</div>


<div class="shell">

  <!-- ============================================================
       DOCUMENTS PANEL
       ============================================================ -->

  <div class="doc-panel">

    <div class="doc-panel-header">
      <h2>Documents</h2>
    </div>

    <label class="dropzone" id="dropzone" for="file">
      <div class="dropzone-icon">⇪</div>
      <div class="dropzone-label">Upload a document</div>
      <div class="dropzone-sub">
        PDF · DOCX · CSV · XLSX · TXT
      </div>

      <input
        id="file"
        type="file"
        accept=".pdf,.docx,.csv,.xlsx,.txt"
      >
    </label>

    <div class="doc-list" id="docList">
      <!-- populated by renderDocuments() -->
    </div>

  </div>


  <!-- ============================================================
       CHAT PANEL
       ============================================================ -->

  <div class="chat-panel">

    <div class="chat-log" id="chatLog">
      <div class="chat-log-inner" id="chatLogInner"></div>
    </div>

    <div class="composer">

      <div class="composer-inner">

        <input
          id="input"
          placeholder="Ask about your documents…"
          autocomplete="off"
        >

        <button
          class="btn-primary"
          id="sendBtn"
          onclick="send()"
        >
          Send
        </button>

        <button
          class="btn-primary"
          id="stopBtn"
          onclick="stopGeneration()"
          disabled
        >
          Stop
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* ================================================================
   STATE
   ================================================================ */

const API_BASE = "http://127.0.0.1:8000";

let documents = [];

let tempIdCounter = 0;

let controller = null;


/* ================================================================
   DOCUMENTS
   ================================================================ */

async function loadDocuments() {

  try {

    const res = await fetch(`${API_BASE}/documents`);

    const data = await res.json();

    documents = data.map(d => ({
      id: d.id,
      filename: d.filename,
      status: "ready",
      chunk_count: d.chunk_count
    }));

  } catch (err) {

    documents = [];

  }

  renderDocuments();

  renderEmptyState();
}


function renderDocuments() {

  const list = document.getElementById("docList");

  if (documents.length === 0) {

    list.innerHTML =
      `<div class="doc-empty">No documents yet.</div>`;

    return;
  }

  list.innerHTML = documents.map(doc => {

    const key = doc.id ?? doc.tempId;

    let statusHtml;

    if (doc.status === "processing") {

      statusHtml = `
        <span class="doc-status processing">
          <span class="doc-status-dot"></span>
          <span class="doc-status-text">Processing…</span>
        </span>
      `;

    } else if (doc.status === "error") {

      statusHtml = `
        <span class="doc-status error">
          <span class="doc-status-dot"></span>
          <span class="doc-status-text">
            ${escapeHtml(doc.errorMessage || "Failed")}
          </span>
        </span>
      `;

    } else {

      statusHtml = `
        <span class="doc-status ready">
          <span class="doc-status-dot"></span>
          <span class="doc-status-text">
            Ready · ${doc.chunk_count}
            chunk${doc.chunk_count === 1 ? "" : "s"}
          </span>
        </span>
      `;
    }

    return `
      <div class="doc-row" data-key="${key}">

        <div class="doc-row-top">

          <span
            class="doc-name"
            title="${escapeHtml(doc.filename)}"
          >
            ${escapeHtml(doc.filename)}
          </span>

          <button
            class="doc-delete"
            onclick="deleteDocument('${key}')"
            ${doc.status === "processing" ? "disabled" : ""}
            aria-label="Delete ${escapeHtml(doc.filename)}"
          >
            ✕
          </button>

        </div>

        ${statusHtml}

      </div>
    `;

  }).join("");
}


function escapeHtml(str) {

  const div = document.createElement("div");

  div.textContent = str;

  return div.innerHTML;
}


/*
   Renders a minimal, safe subset of markdown
   (bold, italic, inline code) for assistant
   text. Input is HTML-escaped first, so this
   never introduces unescaped user/model HTML.
*/

function renderInlineMarkdown(text) {

  let out = escapeHtml(text);

  // **bold**
  out = out.replace(
    /\*\*([^\*]+)\*\*/g,
    "<strong>$1</strong>"
  );

  // *italic* (skip already-consumed ** pairs)
  out = out.replace(
    /(^|[^*])\*([^*\n]+)\*(?!\*)/g,
    "$1<em>$2</em>"
  );

  // `inline code`
  out = out.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  return out;
}


/* ================================================================
   FILE UPLOAD
   ================================================================ */

document
  .getElementById("file")
  .addEventListener("change", (e) => {

    const file = e.target.files[0];

    if (file) {
      uploadFile(file);
    }

    e.target.value = "";

  });


const dropzone = document.getElementById("dropzone");


["dragenter", "dragover"].forEach(evt => {

  dropzone.addEventListener(evt, (e) => {

    e.preventDefault();

    dropzone.classList.add("dragover");

  });

});


["dragleave", "drop"].forEach(evt => {

  dropzone.addEventListener(evt, (e) => {

    e.preventDefault();

    dropzone.classList.remove("dragover");

  });

});


dropzone.addEventListener("drop", (e) => {

  const file = e.dataTransfer.files[0];

  if (file) {
    uploadFile(file);
  }

});


async function uploadFile(file) {

  const tempId = `temp-${++tempIdCounter}`;

  documents = [
    {
      tempId,
      filename: file.name,
      status: "processing"
    },
    ...documents
  ];

  renderDocuments();


  try {

    const formData = new FormData();

    formData.append("file", file);


    const res = await fetch(`${API_BASE}/upload`, {
      method: "POST",
      body: formData
    });


    const data = await res.json();


    if (!res.ok) {
      throw new Error(
        data.detail || `HTTP ${res.status}`
      );
    }


    documents = documents.map(d =>
      d.tempId === tempId
        ? {
            id: data.document_id,
            filename: data.filename,
            status: "ready",
            chunk_count: data.chunk_count
          }
        : d
    );

  } catch (err) {

    documents = documents.map(d =>
      d.tempId === tempId
        ? {
            ...d,
            status: "error",
            errorMessage: err.message
          }
        : d
    );

  }


  renderDocuments();

  renderEmptyState();
}


/* ================================================================
   DELETE DOCUMENT
   ================================================================ */

async function deleteDocument(key) {

  const doc = documents.find(
    d => String(d.id ?? d.tempId) === String(key)
  );

  if (!doc) return;


  if (!doc.id) {

    documents = documents.filter(
      d => d !== doc
    );

    renderDocuments();

    renderEmptyState();

    return;
  }


  try {

    const res = await fetch(
      `${API_BASE}/documents/${doc.id}`,
      {
        method: "DELETE"
      }
    );


    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }


    documents = documents.filter(
      d => d.id !== doc.id
    );


    renderDocuments();

    renderEmptyState();

  } catch (err) {

    doc.status = "error";

    doc.errorMessage = "Delete failed";

    renderDocuments();

  }
}


/* ================================================================
   CHAT
   ================================================================ */

const chatLogInner =
  document.getElementById("chatLogInner");

const chatLogEl =
  document.getElementById("chatLog");

/*
   Sticky-scroll tracking.

   We only auto-scroll to the bottom while the
   user is already near the bottom. If they scroll
   up to read earlier messages, streaming tokens
   will no longer yank the view back down.
*/

let stickToBottom = true;

chatLogEl.addEventListener("scroll", () => {

  const distanceFromBottom =
    chatLogEl.scrollHeight -
    chatLogEl.scrollTop -
    chatLogEl.clientHeight;

  stickToBottom = distanceFromBottom < 60;

});

function scrollToBottomIfSticky() {

  if (stickToBottom) {
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
  }
}


/*
   Creates a chat message.

   For assistant messages we create TWO containers:

      message bubble
      sources container

   The sources container remains hidden until the backend
   sends the "sources" SSE event.
*/

function addMessage(
  role,
  text,
  { isError = false } = {}
) {

  const row =
    document.createElement("div");

  row.className =
    `msg-row ${role}`;


  const block =
    document.createElement("div");

  block.className =
    "msg-block";


  const label =
    document.createElement("div");

  label.className =
    "msg-label";

  label.textContent =
    role === "user"
      ? "You"
      : "Assistant";


  const bubble =
    document.createElement("div");

  bubble.className =
    "msg-bubble" +
    (isError ? " error" : "");


  bubble.textContent = text;


  block.appendChild(label);

  block.appendChild(bubble);


  /*
     SOURCES CONTAINER

     Only assistant messages get a sources section.
  */

  let sourcesContainer = null;

  if (role === "assistant") {

    sourcesContainer =
      document.createElement("div");

    sourcesContainer.className =
      "sources";

    block.appendChild(
      sourcesContainer
    );
  }


  row.appendChild(block);

  chatLogInner.appendChild(row);


  scrollToBottomIfSticky();


  return {
    bubble,
    sourcesContainer
  };
}


/* ================================================================
   SOURCE RENDERING
   ================================================================ */

function renderSources(
  container,
  sources
) {

  if (!container) {
    return;
  }


  if (!Array.isArray(sources) || sources.length === 0) {
    return;
  }


  /*
     Deduplicate sources.

     The backend already deduplicates them,
     but doing it here as well makes the frontend
     robust against duplicate SSE data.
  */

  const uniqueSources = [];

  const seen = new Set();


  for (const source of sources) {

    if (!source || !source.filename) {
      continue;
    }


    const key =
      `${source.document_id ?? ""}:${source.filename}`;


    if (seen.has(key)) {
      continue;
    }


    seen.add(key);

    uniqueSources.push(source);
  }


  if (uniqueSources.length === 0) {
    return;
  }


  container.innerHTML = "";


  const title =
    document.createElement("div");

  title.className =
    "sources-title";

  title.textContent =
    "Sources";


  container.appendChild(title);


  const list =
    document.createElement("div");

  list.className =
    "source-list";


  uniqueSources.forEach(source => {

    const item =
      document.createElement("div");

    item.className =
      "source-item";


    const icon =
      document.createElement("span");

    icon.className =
      "source-icon";

    icon.textContent =
      "📄";


    const filename =
      document.createElement("span");

    filename.className =
      "source-filename";

    /*
       textContent prevents filenames from being
       interpreted as HTML.
    */

    filename.textContent =
      source.filename;


    item.appendChild(icon);

    item.appendChild(filename);

    list.appendChild(item);

  });


  container.appendChild(list);

  container.classList.add("visible");
}


/* ================================================================
   EMPTY STATE
   ================================================================ */

function renderEmptyState() {

  const hasReadyDoc =
    documents.some(
      d => d.status === "ready"
    );


  const alreadyShown =
    document.getElementById(
      "emptyStateMsg"
    );


  if (!hasReadyDoc && !alreadyShown) {

    const message =
      addMessage(
        "assistant",
        "Upload a document to get started — I can only answer questions about what you've uploaded."
      );


    message.bubble
      .parentElement
      .parentElement
      .id = "emptyStateMsg";


  } else if (hasReadyDoc && alreadyShown) {

    alreadyShown.remove();

  }
}


/* ================================================================
   SEND MESSAGE
   ================================================================ */

async function send() {

  const inputEl =
    document.getElementById("input");


  const message =
    inputEl.value.trim();


  if (!message) {
    return;
  }


  const btn =
    document.getElementById("sendBtn");


  const stopBtn =
    document.getElementById("stopBtn");


  btn.disabled = true;

  stopBtn.disabled = false;


  controller =
    new AbortController();


  inputEl.value = "";


  /*
     Add user message.

     Sending a new message re-enables the sticky
     auto-scroll, since the user presumably wants
     to watch the reply come in.
  */

  stickToBottom = true;

  addMessage(
    "user",
    message
  );


  /*
     Create assistant message.

     We keep references to BOTH the bubble and
     the sources container.
  */

  const assistantMessage =
    addMessage(
      "assistant",
      ""
    );


  const responseBubble =
    assistantMessage.bubble;


  const sourcesContainer =
    assistantMessage.sourcesContainer;


  /*
     Raw accumulated text for the assistant reply.

     We keep this separate from the DOM because the
     bubble is rendered as HTML (to support **bold**
     etc. from the model), so we can't just append to
     textContent/innerHTML directly without re-parsing
     already-rendered tags.
  */

  let rawText = "";


  try {

    const res =
      await fetch(
        `${API_BASE}/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            query: message
          }),

          signal:
            controller.signal
        }
      );


    if (!res.ok) {

      const errBody =
        await res.json()
          .catch(() => ({}));


      responseBubble.textContent =
        errBody.detail ||
        `HTTP ${res.status}`;


      return;
    }


    /* ------------------------------------------------------------
       SSE STREAM
       ------------------------------------------------------------ */

    const reader =
      res.body.getReader();


    const decoder =
      new TextDecoder();


    let buffer = "";


    while (true) {

      const {
        done,
        value
      } = await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      /*
         SSE events are separated by
         a blank line.
      */

      const frames =
        buffer.split("\n\n");


      /*
         Keep the incomplete frame
         for the next network chunk.
      */

      buffer =
        frames.pop();


      for (const frame of frames) {

        const line =
          frame.trim();


        if (!line.startsWith("data:")) {
          continue;
        }


        const payload =
          line
            .slice("data:".length)
            .trim();


        /*
           End of stream marker.
        */

        if (payload === "[DONE]") {
          continue;
        }


        try {

          const parsed =
            JSON.parse(payload);


          /* ------------------------------------------------------
             ERROR EVENT
             ------------------------------------------------------ */

          if (parsed.error) {

            responseBubble.classList.add(
              "error"
            );


            rawText +=
              `\n[stream error: ${parsed.error}]`;

            responseBubble.innerHTML =
              renderInlineMarkdown(rawText);
          }


          /* ------------------------------------------------------
             NORMAL ASSISTANT TOKEN
             ------------------------------------------------------ */

          else if (parsed.content) {

            rawText +=
              parsed.content;

            responseBubble.innerHTML =
              renderInlineMarkdown(rawText);
          }


          /* ------------------------------------------------------
             SOURCE EVENT
             ------------------------------------------------------

             Backend sends:

             {
               "sources": [
                 {
                   "filename": "book.pdf",
                   "document_id": 1
                 }
               ]
             }

          */

          if (parsed.sources) {

            renderSources(
              sourcesContainer,
              parsed.sources
            );
          }


        } catch (error) {

          /*
             Ignore malformed SSE frames
             and continue streaming.
          */

          console.warn(
            "Could not parse SSE event:",
            payload
          );
        }


        /*
           Keep chat scrolled to the newest content —
           but only if the user hasn't scrolled away.
        */

        scrollToBottomIfSticky();

      }

    }


  } catch (err) {

    if (err.name === "AbortError") {

      rawText +=
        "\n\n[Stopped]";

      responseBubble.innerHTML =
        renderInlineMarkdown(rawText);

      return;
    }


    responseBubble.classList.add(
      "error"
    );


    responseBubble.textContent =
      "Could not reach backend: " +
      err.message;

  } finally {

    controller = null;

    btn.disabled = false;

    stopBtn.disabled = true;

    inputEl.focus();

  }
}


/* ================================================================
   ENTER TO SEND
   ================================================================ */

document
  .getElementById("input")
  .addEventListener(
    "keydown",
    (e) => {

      if (e.key === "Enter") {
        send();
      }

    }
  );


/* ================================================================
   STOP GENERATION
   ================================================================ */

function stopGeneration() {

  if (!controller) {
    return;
  }

  controller.abort();
}


loadDocuments();

</script>
